name: build-and-test

# Builds the package in an official Arch container, then runs the bats suite
# in tests/ against the installed result.
#
# The behavioral assertions live in tests/, not inline here, so the same
# checks a contributor runs locally (tests/run.sh) are the ones CI runs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  makepkg:
    # Runs inside Arch because it builds and installs a pacman package;
    # makepkg also refuses to run as root, hence the `builder` user below.
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install git before checkout
        # archlinux:base-devel ships no git, and actions/checkout silently
        # degrades to a REST-API tarball download (no .git directory) when
        # git >= 2.18 is absent from PATH. Nothing here needs .git today,
        # but the degraded mode is invisible and bites the moment a git
        # command is added, so make the checkout a real clone.
        run: |
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -S  --noconfirm --needed git

      - name: Checkout
        uses: actions/checkout@v5

      - name: Update system and install build/test deps
        run: |
          pacman -Su --noconfirm
          pacman -S --needed --noconfirm base-devel sudo namcap shellcheck \
                                         pacman-contrib bats handlr-regex

      - name: Create unprivileged build user
        # makepkg refuses to run as root; create a throwaway user with
        # passwordless sudo, matching how AUR helpers operate.
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Lint shell sources
        run: shellcheck -s sh xdg-open xdg-mime tests/run.sh

      - name: Lint test helpers
        run: shellcheck -s bash tests/helpers.bash

      - name: Lint PKGBUILD with namcap
        run: |
          set -eu
          namcap PKGBUILD | tee namcap-pkgbuild.log
          # namcap exits 0 even when it reports problems, so gate on the
          # error prefix explicitly. Warnings are printed for review.
          if grep -q ' E: ' namcap-pkgbuild.log; then
            echo "::error::namcap reported errors on PKGBUILD"
            exit 1
          fi

      - name: Verify .SRCINFO is in sync with PKGBUILD
        run: |
          set -eu
          su builder -c 'makepkg --printsrcinfo > .SRCINFO.generated'
          diff -u .SRCINFO .SRCINFO.generated || {
            echo "::error::.SRCINFO is out of date. Run 'makepkg --printsrcinfo > .SRCINFO' and commit."
            exit 1
          }

      - name: Build package
        run: su builder -c 'makepkg -sf --noconfirm'

      - name: Lint built package with namcap
        run: |
          set -eu
          namcap ./*.pkg.tar.zst | tee namcap-pkg.log
          # Two warnings are known false positives and are not gated on:
          #   - "Referenced library 'sh'": the shims use #!/bin/sh, provided
          #     by bash in `base`, which namcap does not model.
          #   - "Dependency included, but may not be needed ('handlr-regex')":
          #     namcap only inspects library links, never shell-level
          #     `command -v handlr` / `handlr open` calls.
          if grep -q ' E: ' namcap-pkg.log; then
            echo "::error::namcap reported errors on the built package"
            exit 1
          fi

      - name: Install built package
        run: pacman -U --noconfirm ./*.pkg.tar.zst

      - name: Run the test suite against the installed package
        run: tests/run.sh --installed

      - name: Upload built package artifact
        uses: actions/upload-artifact@v7
        with:
          name: xdg-utils-handlr-pkg
          path: "*.pkg.tar.zst"
