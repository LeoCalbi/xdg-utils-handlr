name: build-and-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  makepkg:
    # Build and smoke-test the package inside an official Arch Linux
    # container, since makepkg refuses to run as root without
    # --asroot and Arch's own actions runners are not guaranteed.
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update system and install build/runtime deps
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm git base-devel sudo

      - name: Create unprivileged build user
        # makepkg refuses to run as root; create a throwaway user
        # with passwordless sudo, matching how AUR helpers operate.
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Install handlr-regex from AUR (build dependency for testing)
        run: |
          su builder -c '
            set -e
            cd /home/builder
            git clone https://aur.archlinux.org/handlr-regex.git
            cd handlr-regex
            makepkg -si --noconfirm
          '

      - name: Generate/verify .SRCINFO is in sync with PKGBUILD
        run: |
          chown -R builder:builder .
          su builder -c 'cd "$PWD" && makepkg --printsrcinfo > .SRCINFO.generated'
          diff -u .SRCINFO .SRCINFO.generated || {
            echo "::error::.SRCINFO is out of date. Run 'makepkg --printsrcinfo > .SRCINFO' and commit."
            exit 1
          }

      - name: Build package
        run: |
          su builder -c 'cd "$PWD" && makepkg -sf --noconfirm'

      - name: Install built package
        run: |
          pacman -U --noconfirm ./*.pkg.tar.zst

      - name: Smoke test - binaries present and executable
        run: |
          set -e
          for tool in xdg-open xdg-mime xdg-settings xdg-desktop-menu \
                      xdg-desktop-icon xdg-icon-resource xdg-email \
                      xdg-screensaver; do
            command -v "$tool" >/dev/null || { echo "missing: $tool"; exit 1; }
          done
          echo "All 8 xdg-utils tools present."

      - name: Smoke test - xdg-open shim behavior
        run: |
          set -e
          # --help / --manual / --version must not error
          xdg-open --help
          xdg-open --manual
          xdg-open --version || true   # exits 3 if handlr missing; both OK to observe here

          # No args -> syntax error (exit 1)
          if xdg-open; then
            echo "::error::xdg-open with no args should fail"; exit 1
          fi

          # Nonexistent local file -> exit 2
          if xdg-open /nonexistent/path/does-not-exist; then
            echo "::error::xdg-open on missing file should fail with 2"; exit 1
          fi

      - name: Smoke test - xdg-mime shim query/default routing
        run: |
          set -e
          xdg-open --help >/dev/null
          echo "test content" > /tmp/sample.txt
          xdg-mime query filetype /tmp/sample.txt
          xdg-mime query default text/plain || true

      - name: Smoke test - xdg-mime install/uninstall fallback path exists
        run: |
          test -x /usr/lib/xdg-utils-handlr/xdg-mime.upstream
          echo "Upstream xdg-mime fallback present."

      - name: Verify pacman sees this package as providing xdg-utils
        run: |
          pacman -Qi xdg-utils-handlr | grep -i "Provides" | grep -q "xdg-utils"

      - name: Upload built package artifact
        uses: actions/upload-artifact@v4
        with:
          name: xdg-utils-handlr-pkg
          path: "*.pkg.tar.zst"
