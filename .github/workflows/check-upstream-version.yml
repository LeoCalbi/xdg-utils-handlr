name: check-upstream-version

# Watches the upstream freedesktop.org xdg-utils project for new tags and,
# when one is found that we haven't packaged yet, opens a pull request that
# bumps pkgver/pkgrel, recomputes the tarball sha256sum, and regenerates
# .SRCINFO.
#
# If the PR can't be created/updated automatically for any reason, it falls
# back to opening (or updating) a tracking issue instead, so a new upstream
# release is never silently missed.
#
# Architecture note: this job runs on the *host* runner, not inside an
# archlinux container, and reaches into Arch only for the two commands that
# genuinely need it (updpkgsums, makepkg --printsrcinfo). archlinux:base-devel
# ships no git, so running the whole job in the container made
# actions/checkout silently fall back to a REST-API tarball download with no
# .git directory -- which broke every git step downstream. Keeping git,
# Node and the token on the host avoids that entire class of failure.

on:
  schedule:
    # Every Monday at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: check-upstream-version
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Determine current and latest upstream version
        id: versions
        run: |
          set -eu
          current="$(grep -m1 '^pkgver=' PKGBUILD | cut -d= -f2)"
          echo "current=${current}" >> "$GITHUB_OUTPUT"

          # xdg-utils lives on gitlab.freedesktop.org, project path xdg/xdg-utils.
          # Tags are named like "v1.2.1"; pick the highest by version sort.
          latest_tag="$(curl -sf \
            'https://gitlab.freedesktop.org/api/v4/projects/xdg%2Fxdg-utils/repository/tags?order_by=name&sort=desc' \
            | jq -r '[.[].name | select(test("^v[0-9]+(\\.[0-9]+)*$"))] | sort_by(. | ltrimstr("v") | split(".") | map(tonumber)) | last')"

          if [ -z "$latest_tag" ] || [ "$latest_tag" = "null" ]; then
            echo "::error::Could not determine latest upstream tag from GitLab API"
            exit 1
          fi

          latest="${latest_tag#v}"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${latest_tag}" >> "$GITHUB_OUTPUT"

          if [ "$current" = "$latest" ]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report up-to-date
        if: steps.versions.outputs.up_to_date == 'true'
        run: |
          msg="Already on latest upstream xdg-utils (${{ steps.versions.outputs.current }}); no PR needed."
          echo "$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

      - name: Bump pkgver / reset pkgrel
        if: steps.versions.outputs.up_to_date == 'false'
        run: |
          set -eu
          sed -i "s/^pkgver=.*/pkgver=${{ steps.versions.outputs.latest }}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD

      - name: Refresh tarball checksum and .SRCINFO (Arch container)
        if: steps.versions.outputs.up_to_date == 'false'
        run: |
          set -eu
          # Only the remote tarball has a real sha256sum (the local shims are
          # SKIP), so updpkgsums here just re-fetches and re-hashes the new
          # upstream archive.
          docker run --rm -v "$PWD:/pkg" -w /pkg archlinux:base-devel bash -eu -c '
            pacman -Sy --noconfirm --needed archlinux-keyring
            pacman -S  --noconfirm --needed base-devel pacman-contrib
            useradd -m builder
            chown -R builder:builder /pkg
            su builder -c "updpkgsums && makepkg --printsrcinfo > .SRCINFO"
          '
          # The container wrote as its own uid; hand the tree back to the
          # runner user so the git steps below can read and stage it.
          sudo chown -R "$(id -u):$(id -g)" .

      - name: Show what changed
        if: steps.versions.outputs.up_to_date == 'false'
        run: git diff -- PKGBUILD .SRCINFO

      - name: Build and test the bumped package
        # GitHub does not run pull_request workflows on PRs opened with the
        # default GITHUB_TOKEN, so build-and-test will NOT run against the
        # PR this job is about to create. Run the suite here instead and
        # report the result in the PR body -- otherwise an upstream release
        # that breaks the shims would land in a green-looking PR.
        if: steps.versions.outputs.up_to_date == 'false'
        id: verify
        continue-on-error: true
        run: |
          set -eu
          docker run --rm -v "$PWD:/pkg" -w /pkg archlinux:base-devel bash -eu -c '
            pacman -Sy --noconfirm --needed archlinux-keyring >/dev/null
            pacman -S  --noconfirm --needed base-devel sudo bats handlr-regex >/dev/null
            useradd -m builder
            echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
            chown -R builder:builder /pkg
            su builder -c "makepkg -sf --noconfirm"
            pacman -U --noconfirm ./*.pkg.tar.zst
            tests/run.sh --installed
          ' 2>&1 | tee verify.log
          sudo chown -R "$(id -u):$(id -g)" .

      - name: Summarize the verification result
        if: steps.versions.outputs.up_to_date == 'false'
        id: verdict
        run: |
          set -eu
          if [ "${{ steps.verify.outcome }}" = "success" ]; then
            echo "status=:white_check_mark: The test suite passes against this version." >> "$GITHUB_OUTPUT"
          else
            echo "status=:x: **The test suite FAILS against this version** -- do not merge without investigating. See the workflow log." >> "$GITHUB_OUTPUT"
          fi
          rm -f verify.log

      - name: Open pull request with the version bump
        if: steps.versions.outputs.up_to_date == 'false'
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: "upstream-bump/xdg-utils-${{ steps.versions.outputs.latest }}"
          commit-message: "build(pkg): ⬆️ bump vendored xdg-utils to ${{ steps.versions.outputs.latest }}"
          title: "build(pkg): ⬆️ bump vendored xdg-utils to ${{ steps.versions.outputs.latest }}"
          body: |
            Upstream `xdg-utils` released **${{ steps.versions.outputs.latest_tag }}**
            (was `${{ steps.versions.outputs.current }}`):
            https://gitlab.freedesktop.org/xdg/xdg-utils/-/tags/${{ steps.versions.outputs.latest_tag }}

            This PR was opened automatically by the `check-upstream-version`
            workflow. It updates:
            - `pkgver` (and resets `pkgrel` to `1`)
            - the tarball `sha256sums` entry (recomputed with `updpkgsums`)
            - `.SRCINFO` (regenerated with `makepkg --printsrcinfo`)

            Please review the upstream changelog/diff before merging — in
            particular check whether any of the vendored scripts
            (`xdg-settings`, `xdg-desktop-menu`, `xdg-desktop-icon`,
            `xdg-icon-resource`, `xdg-email`, `xdg-screensaver`, or the
            fallback `xdg-mime.upstream`) changed their CLI surface in a way
            that would affect the `xdg-open`/`xdg-mime` shims.

            ### Verification

            ${{ steps.verdict.outputs.status }}

            The suite was run by the `check-upstream-version` workflow before
            this PR was opened, because GitHub does not run `pull_request`
            workflows on PRs created with the default `GITHUB_TOKEN`. Push an
            empty commit if you want `build-and-test` to run here as well.
          labels: |
            upstream-update
            automated-pr
          delete-branch: true

      - name: Fall back to an issue if the PR step failed
        if: failure() && steps.versions.outputs.up_to_date == 'false'
        uses: actions/github-script@v8
        with:
          script: |
            const latest = "${{ steps.versions.outputs.latest_tag }}";
            const current = "${{ steps.versions.outputs.current }}";
            const title = `Upstream xdg-utils ${latest} available (packaged: ${current})`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "upstream-update",
            });
            if (existing.some(i => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ["upstream-update"],
              body:
                `The automated version-bump PR could not be created/updated.\n\n` +
                `Upstream released **${latest}** (currently packaged: **${current}**):\n` +
                `https://gitlab.freedesktop.org/xdg/xdg-utils/-/tags/${latest}\n\n` +
                `Please bump \`pkgver\` manually, run \`updpkgsums\`, regenerate ` +
                `\`.SRCINFO\`, and open a PR.`,
            });
